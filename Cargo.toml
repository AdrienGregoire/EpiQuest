[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "migrate"] }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
uuid = {version = "1.29.0", features = ["v4", "serde"]}
chrono = {version = "0.4.45", features = ["serde"]}
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter"]}
thiserror = "2.0.21"
shared = { path = "crates/shared" }
